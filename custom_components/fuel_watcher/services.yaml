# Commit: feat(services): restore full service suite from v0.0.27 with new storage backend

########################################
# Tank History Services
########################################

add_tank_event:
  name: Add Tank Event
  description: Add a tank event manually.
  fields:
    price_per_liter:
      description: Price per liter
      example: 1.72
    liters:
      description: Liters
      example: 42.5
    total_cost:
      description: Total cost (optional, auto-calculated if missing)
      example: 73.10
    station_name:
      description: Station name
      example: Shell Hamburg
    odometer:
      description: Odometer reading
      example: 123456
    source:
      description: Source of the event
      example: manual

update_tank_event:
  name: Update Tank Event
  description: Update an existing tank event.
  fields:
    event_id:
      description: ID of the event to update
      example: 3
    price_per_liter:
      description: New price per liter
    liters:
      description: New liters
    total_cost:
      description: New total cost
    station_name:
      description: New station name
    odometer:
      description: New odometer value

delete_tank_event:
  name: Delete Tank Event
  description: Delete a tank event by ID.
  fields:
    event_id:
      description: ID of the event to delete
      example: 3

clear_tank_history:
  name: Clear Tank History
  description: Remove all tank events.


########################################
# Odometer / Statistics Services
########################################

add_odometer:
  name: Add Odometer Reading
  description: Add a new odometer reading.
  fields:
    value:
      description: Odometer value
      example: 123456

clear_odometer_history:
  name: Clear Odometer History
  description: Remove all odometer entries.

recompute_statistics:
  name: Recompute Statistics
  description: Rebuild weekday consumption statistics from odometer history.


########################################
# Price Services
########################################

add_price:
  name: Add Price Entry
  description: Add a price entry manually.
  fields:
    price:
      description: Price per liter
      example: 1.72

clear_price_history:
  name: Clear Price History
  description: Remove all price entries.


########################################
# Telegram Services
########################################

send_test_notification:
  name: Send Test Notification
  description: Sends a Telegram test message.

send_custom_message:
  name: Send Custom Telegram Message
  description: Sends a custom Telegram message.
  fields:
    message:
      description: Message text
      example: "Hello from Fuel Watcher"


########################################
# Strategy / Debug Services
########################################

force_update:
  name: Force Full Update
  description: Force Tankerkoenig update and sensor refresh.

debug_dump:
  name: Debug Dump
  description: Dump all internal data to the log.


########################################
# Navigation Services
########################################

send_navigation_message:
  name: Send Navigation Message
  description: Sends a Telegram message with navigation links to the best station.


########################################
# API Services
########################################

force_api_update:
  name: Force API Update
  description: Force Tankerkoenig API call and update best station.


########################################
# Error Handling
########################################

reset_errors:
  name: Reset Errors
  description: Clear last_error in diagnostics.
